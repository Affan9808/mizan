<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="55%" stop-color="#0a0908"/>
      <stop offset="100%" stop-color="#020202"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7e2a0"/>
      <stop offset="45%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#96751f"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="100%" stop-color="#a8802a"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- faint starfield -->
  <g fill="#f7e2a0" opacity="0.55">
    <circle cx="70" cy="90" r="1.6"/><circle cx="120" cy="55" r="1.1"/><circle cx="430" cy="80" r="1.4"/>
    <circle cx="460" cy="140" r="1.1"/><circle cx="60" cy="360" r="1.3"/><circle cx="45" cy="430" r="1.1"/>
    <circle cx="450" cy="400" r="1.5"/><circle cx="470" cy="450" r="1.1"/><circle cx="256" cy="40" r="1.2"/>
    <circle cx="256" cy="472" r="1.2"/><circle cx="100" cy="470" r="1.1"/><circle cx="410" cy="470" r="1.1"/>
  </g>

  <!-- 8-point girih star (two overlapping squares) -->
  <g filter="url(#softGlow)">
    <polygon points="426,256 256,426 86,256 256,86" fill="url(#gold)" fill-opacity="0.10" stroke="url(#gold)" stroke-width="5.5" stroke-linejoin="round"/>
    <polygon points="376.2,135.8 376.2,376.2 135.8,376.2 135.8,135.8" fill="url(#gold)" fill-opacity="0.10" stroke="url(#gold)" stroke-width="5.5" stroke-linejoin="round"/>
  </g>

  <!-- small finial dots at outer star points -->
  <g fill="url(#gold)">
    <circle cx="426" cy="256" r="4.2"/><circle cx="256" cy="426" r="4.2"/><circle cx="86" cy="256" r="4.2"/><circle cx="256" cy="86" r="4.2"/>
    <circle cx="376.2" cy="135.8" r="4.2"/><circle cx="376.2" cy="376.2" r="4.2"/><circle cx="135.8" cy="376.2" r="4.2"/><circle cx="135.8" cy="135.8" r="4.2"/>
  </g>

  <!-- geometric M monogram — angular strokes echo the star's linework, single glyph reads cleanly at small sizes -->
  <g stroke="url(#gold)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softGlow)">
    <polyline points="212,300 212,214 256,268 300,214 300,300"/>
  </g>
  <circle cx="212" cy="214" r="4.5" fill="url(#gold)"/>
  <circle cx="300" cy="214" r="4.5" fill="url(#gold)"/>
</svg>
